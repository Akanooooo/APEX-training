<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APEX Training</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#05080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APEX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <div>
      <div class="brand-name">APEX</div>
      <div class="brand-sub">TRAINING SYSTEM</div>
    </div>
  </div>
  <div class="countdown" id="countdown"></div>
</header>

<main class="app">
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-cal"></section>
  <section class="view" id="view-cardio"></section>
</main>

<div class="rest hidden" id="rest">
  <div class="rest-bar" id="restBar"></div>
  <div class="rest-inner">
    <div>
      <div class="rest-label">PAUSE</div>
      <div class="rest-time" id="restTime">0:00</div>
    </div>
    <div class="rest-actions">
      <button class="btn ghost sm" data-act="rest-add">+15s</button>
      <button class="btn sm" data-act="rest-skip">Weiter</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button class="tab" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Plan</span></button>
  <button class="fab" data-act="add" aria-label="Eintrag hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Kalender</span></button>
  <button class="tab" data-tab="cardio"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>Rekorde</span></button>
</nav>

<div class="sheet hidden" id="sheet">
  <div class="sheet-backdrop" data-act="close"></div>
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<div class="pr hidden" id="pr">
  <div class="pr-inner">
    <div class="pr-kicker">NEUER REKORD</div>
    <div class="pr-value" id="prValue"></div>
    <div class="pr-sub" id="prSub"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="script.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
</script>
</body>
</html>
